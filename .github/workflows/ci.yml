name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.distro }} ${{ matrix.arch }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.distro }}-ros-base
    # A Tier-2 distro may fail without failing the run until it is green (docs/PLAN.md D4).
    # Lyrical was promoted to required in M1.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: humble, arch: amd64, runner: ubuntu-latest, experimental: false}
          - {distro: jazzy, arch: amd64, runner: ubuntu-latest, experimental: false}
          - {distro: lyrical, arch: amd64, runner: ubuntu-latest, experimental: false}
          - {distro: humble, arch: arm64, runner: ubuntu-22.04-arm, experimental: false}
          - {distro: jazzy, arch: arm64, runner: ubuntu-24.04-arm, experimental: false}
          - distro: jazzy
            arch: amd64
            runner: ubuntu-latest
            experimental: false
            variant: C++20
            cmake_args: -DCMAKE_CXX_STANDARD=20
          - distro: jazzy
            arch: amd64
            runner: ubuntu-latest
            experimental: false
            variant: ASan+UBSan
            sanitize: 1
            packages: landfall_core
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/landfall

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install --from-paths src --ignore-src --rosdistro "${ROS_DISTRO}" -y

      - name: Build and test
        env:
          LANDFALL_WS: ${{ github.workspace }}
          LANDFALL_CMAKE_ARGS: ${{ matrix.cmake_args }}
          LANDFALL_SANITIZE: ${{ matrix.sanitize }}
          LANDFALL_PACKAGES: ${{ matrix.packages }}
        run: src/landfall/scripts/ci_build_test.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.distro }}-${{ matrix.arch }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          path: |
            log/
            build/*/test_results/
          if-no-files-found: ignore
