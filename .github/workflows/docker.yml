name: Docker

# The runtime image of each distro (docker/Dockerfile, target runtime), on every push to main and
# on version tags: built, then started (the CLI and the relocalizer node). The images are pushed
# to the GitHub Container Registry only when the repository variable LANDFALL_PUBLISH_IMAGES is
# "true" (Settings > Secrets and variables > Actions > Variables):
#   ghcr.io/<owner>/landfall:<distro>-main     the latest main
#   ghcr.io/<owner>/landfall:<distro>-<tag>    a release (tag v*), also as <distro>

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-image:
    name: runtime image ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical]
    env:
      IMAGE: landfall:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          build-args: ROS_DISTRO=${{ matrix.distro }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          tags: ${{ env.IMAGE }}
      - name: Start the CLI and the relocalizer node
        run: |
          docker run --rm "${IMAGE}" ros2 run landfall_ros landfall --version
          # The node waits, unconfigured, until timeout stops it (exit code 124); any other exit
          # is a failure to start.
          status=0
          docker run --rm "${IMAGE}" timeout 10 ros2 run landfall_ros relocalizer_node || status=$?
          if [[ "${status}" != 124 ]]; then
            echo "relocalizer_node exited with ${status}"
            exit 1
          fi
      - name: Log in to the GitHub Container Registry
        if: vars.LANDFALL_PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: vars.LANDFALL_PUBLISH_IMAGES == 'true'
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/landfall"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags=("${DISTRO}-${GITHUB_REF_NAME}" "${DISTRO}")
          else
            tags=("${DISTRO}-main")
          fi
          for tag in "${tags[@]}"; do
            docker tag "${IMAGE}" "${repo}:${tag}"
            docker push "${repo}:${tag}"
          done
