# Optional checks before each commit (https://pre-commit.com): `pip install pre-commit`, then
# `pre-commit install` in the repository. They are the lint checks of CI
# (.github/workflows/lint.yml) at the same versions; clang-tidy needs a build and runs in CI only
# (scripts/tidy.sh).
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3  # CI's clang-format: Ubuntu 24.04's 18.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length, '99']
        files: ^landfall_tools/
  - repo: local
    hooks:
      - id: check-todos
        name: TODOs are registered in docs/TODO.md
        entry: scripts/check_todos.sh
        language: script
        pass_filenames: false
      - id: check-policies
        name: Repository policies (scripts/check_policies.sh)
        entry: scripts/check_policies.sh
        language: script
        pass_filenames: false
