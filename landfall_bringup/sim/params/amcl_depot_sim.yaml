# AMCL parameter overrides for the depot simulation recording (loaded into the running AMCL by
# sim/scripts/record_depot.sh with `ros2 param load`; AMCL applies them dynamically).
#
# nav2_bringup's defaults are tuned for robustness on real robots: odometry noise alpha 0.2 and
# 60 beams. In this simulation they leave AMCL 8-12 cm off with a reported std of 0.3-0.4 m and
# 16 deg, too loose for recording keyframes (docs/PLAN.md assumption A3). The simulated odometry is
# nearly exact and the scans are clean, so the motion noise is lowered, more beams are used and the
# filter updates more often.
amcl:
  ros__parameters:
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    max_beams: 180
    sigma_hit: 0.05
    z_hit: 0.9
    z_rand: 0.1
    update_min_d: 0.1
    update_min_a: 0.1
