# `landfall build --config` for the depot simulation recordings (sim/scripts/record_depot.sh):
# where the bag keeps its camera, localization and IMU, and the same keyframe gates as the live
# recorder (params/recorder_depot_sim.yaml, which explains them). Everything else is default.
bag:
  image_topic: /rgbd_camera/image/compressed
  camera_info_topic: /rgbd_camera/camera_info
  pose_topic: /amcl_pose
  imu_topic: /imu
  # Gazebo stamps the IMU with its scoped sensor name, which is not a TF frame.
  imu_frame: imu_link
gating:
  max_std_xy: 0.08
  max_std_yaw_deg: 3.0
  max_angular_speed: 0.25
# AMCL's reported covariance is about five times its actual error here (see
# params/recorder_depot_sim.yaml); whitening the BA priors with it lets BA move keyframes by up to
# 5 cm away from the truth. The priors are weighted with the measured accuracy instead: AMCL's
# error had an RMS of 1.35 cm (about 1 cm per axis) and 0.23 deg.
ba:
  prior_std_xy: 0.01
  prior_std_yaw_deg: 0.5
