# map_server and AMCL for the Humble depot runs (sim/launch/depot_humble.launch.xml): the TurtleBot
# 4's localization.yaml (turtlebot4_navigation, Apache-2.0) with the simulator tuning of the Jazzy
# runs (localization_depot_sim.yaml). With the TurtleBot 4's own AMCL parameters (sigma_hit 0.2,
# z_hit 0.5, alphas 0.2), AMCL reported a standard deviation of about 0.3 m in the depot, and the
# recorder's localization gate (8 cm) took no keyframe.
/**/amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.05
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: false
    always_reset_initial_pose: true

/**/map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
