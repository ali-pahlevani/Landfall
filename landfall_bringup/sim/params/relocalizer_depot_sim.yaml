# The relocalizer in the depot simulation (sim/launch/depot_navigation.launch.xml): the
# TurtleBot 4's camera (JPEG through image_transport), IMU and LiDAR topics, as recorded in M2.
/**:
  ros__parameters:
    image:
      topic: /rgbd_camera/image
      transport: compressed
    camera_info:
      topic: /rgbd_camera/camera_info
    imu:
      topic: /imu
      # Gazebo stamps the IMU with its scoped sensor name, which is not a TF frame.
      frame: imu_link
    scan_check:
      topic: /scan
    startup:
      delay: 2.0
      max_attempts: 5
      retry_interval: 5.0
