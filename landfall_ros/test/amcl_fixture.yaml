# AMCL for test_relocalizer_amcl: Nav2's defaults with the depot simulation's tuning
# (landfall_bringup/sim/params/amcl_depot_sim.yaml explains it). No initial pose: AMCL waits for
# the relocalizer's /initialpose.
amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    set_initial_pose: false
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    max_beams: 180
    sigma_hit: 0.05
    z_hit: 0.9
    z_rand: 0.1
    update_min_d: 0.1
    update_min_a: 0.1
