# `landfall build --config` for this fixture: the same settings as the recording it was cut from
# (landfall_bringup/sim/params/build_depot_sim.yaml, which explains the gates and BA priors).
bag:
  image_topic: /rgbd_camera/image/compressed
  camera_info_topic: /rgbd_camera/camera_info
  pose_topic: /amcl_pose
  imu_topic: /imu
  imu_frame: imu_link
gating:
  max_std_xy: 0.08
  max_std_yaw_deg: 3.0
  max_angular_speed: 0.25
ba:
  prior_std_xy: 0.01
  prior_std_yaw_deg: 0.5
