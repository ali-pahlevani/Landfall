# Learned models of landfall_core's ONNX backends (docs/models.md). Never committed: they are made
# by scripts/export_models.sh (landfall_tools/export/) from the pinned upstream files below,
# published as assets of the GitHub release `release` (megaloc: upstream's own file at `url`), and
# downloaded and checked by scripts/fetch_models.sh. Every file has its SHA-256; a database records
# the SHA-256 of the models it was built with and refuses others.
#
# source_sha256: the upstream files an export reads, at source_base + path
# (scripts/fetch_models.sh --upstream DIR downloads and checks them).
release: https://github.com/ali-pahlevani/Landfall/releases/download/models-v1  # TODO(T-007): publish

models:
  - file: xfeat.onnx
    backend: xfeat
    role: local features
    sha256: 8087562aa56e268997d4744370f3b59056d622894ff3672179e63396ad1bfe9d
    parity: xfeat.parity.bin
    parity_sha256: c8d155af27c4b351c2a2591b50579e13cd5dc91ee673d0d661a633b37701a728
    license: Apache-2.0 (code and weights)
    upstream: https://github.com/verlab/accelerated_features
